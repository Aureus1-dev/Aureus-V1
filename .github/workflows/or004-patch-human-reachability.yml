name: OR-004 Human Reachability Repair Helper

on:
  push:
    branches:
      - feat/or-004-people-need-resolution
    paths:
      - .github/workflows/or004-patch-human-reachability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/or-004-people-need-resolution
          fetch-depth: 0

      - name: Fail closed when no Human Steward is reachable
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('apps/api/src/people-resolutions/people-resolutions.service.ts')
          text = service.read_text()
          old = """    const open = rows.find(
      (row) =>
        row.status === NeedEscalationStatus.PENDING ||
        row.status === NeedEscalationStatus.ACKNOWLEDGED,
    );
    if (!open) {
      await this.escalations.escalate(need.id, dto.reason?.trim() || undefined, caller.id);
    }
"""
          new = """    const open = rows.find(
      (row) =>
        row.status === NeedEscalationStatus.PENDING ||
        row.status === NeedEscalationStatus.ACKNOWLEDGED,
    );
    if (!open) {
      const humanReachable = await this.needs.isHumanStewardReachable();
      if (!humanReachable) {
        // A direct endpoint call must not manufacture a Human Steward handoff
        // when the staffing source says nobody is currently reachable. Re-run
        // deterministic continuation so another safe route is preserved or
        // the Responsibility exhausts from real source-domain evidence.
        return this.continue(responsibility.id, caller);
      }
      await this.escalations.escalate(need.id, dto.reason?.trim() || undefined, caller.id);
    }
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one service target, found {text.count(old)}')
          service.write_text(text.replace(old, new, 1))

          spec = Path('apps/api/src/people-resolutions/people-resolutions.service.spec.ts')
          text = spec.read_text()
          marker = """  it('pages a human only after the member explicitly asks', async () => {
"""
          test = """  it('does not create a human escalation when nobody is reachable', async () => {
    responsibilities.findOwnedPersonalNeedResolution.mockResolvedValue(
      responsibility(ResponsibilityStatus.WAITING_ON_USER),
    );
    needs.isHumanStewardReachable.mockResolvedValue(false);
    needs.findMatchingResources.mockResolvedValue([]);
    needs.checkSafeFailure.mockResolvedValue({
      triggered: true,
      recordId: '88888888-8888-4888-8888-888888888888',
      reason: 'NO_VERIFIED_RESOURCE_NO_STEWARD',
      message: 'No verified route is available.',
      nextStep: 'Aureus will preserve the need.',
      recordedAt: new Date(),
    });
    responsibilities.exhaustPersonalNeedWithEvidence.mockResolvedValue(
      responsibility(ResponsibilityStatus.RESPONSIBLY_EXHAUSTED),
    );

    const result = await service.requestHumanSteward(
      '44444444-4444-4444-8444-444444444444',
      { reason: 'I need someone to call with me' },
      caller,
    );

    expect(escalations.escalate).not.toHaveBeenCalled();
    expect(result.responsibility.status).toBe(ResponsibilityStatus.RESPONSIBLY_EXHAUSTED);
  });

"""
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one spec marker, found {text.count(marker)}')
          spec.write_text(text.replace(marker, test + marker, 1))
          PY

      - name: Commit exact repair
        run: |
          git diff --check
          git diff -- apps/api/src/people-resolutions/people-resolutions.service.ts apps/api/src/people-resolutions/people-resolutions.service.spec.ts
          if git diff --quiet -- apps/api/src/people-resolutions/people-resolutions.service.ts apps/api/src/people-resolutions/people-resolutions.service.spec.ts; then
            echo "No repair required"
            exit 0
          fi
          git config user.name "Aureus OR-004 Builder"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/people-resolutions/people-resolutions.service.ts apps/api/src/people-resolutions/people-resolutions.service.spec.ts
          git commit -m "OR-004: fail closed on unreachable Human Steward"
          git push origin HEAD:feat/or-004-people-need-resolution
