name: People Step 3 Diagnostic

on:
  push:
    branches: ["people-step3-household-continuity"]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aureus
          POSTGRES_PASSWORD: aureus
          POSTGRES_DB: aureus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aureus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://aureus:aureus@localhost:5432/aureus?schema=public"
      JWT_ACCESS_SECRET: "ci-only-secret-do-not-use-in-production-min-32-chars"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"
          run_install: false
      - run: pnpm install
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Run Step 3 test with captured diagnostics
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @aureus-v1/api exec jest household-continuity.e2e.spec.ts --runInBand --verbose 2>&1 | tee step3-test.log
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: people-step3-test-log
          path: step3-test.log
