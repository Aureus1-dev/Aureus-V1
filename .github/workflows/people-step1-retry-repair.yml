name: People Step 1 retry identity repair

on:
  push:
    branches:
      - people/step1-need-to-resolution-v2

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[people-step1-retry-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply retry identity repair
        run: python scripts/people_step1_retry_repair.py

      - name: Remove constructor-only repair files
        run: rm -f .github/workflows/people-step1-retry-repair.yml scripts/people_step1_retry_repair.py

      - name: Sanity checks
        run: |
          set -euo pipefail
          grep -q 'Same canonical need stays the same promise' apps/api/src/responsibilities/responsibilities.service.ts
          grep -q 'new Set(attempts.map((row) => row.id)).size' apps/api/src/responsibilities/responsibilities.integration.spec.ts
          grep -q 'retry of the same StatedNeed' apps/api/src/people-resolutions/people-resolutions.e2e.spec.ts
          test ! -e .github/workflows/people-step1-retry-repair.yml
          test ! -e scripts/people_step1_retry_repair.py

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'Aureus Step Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve Step 1 StatedNeed identity across retries [people-step1-retry-repaired]'
          git push origin HEAD:people/step1-need-to-resolution-v2
