name: People Step 3 Finalizer

on:
  push:
    branches:
      - people-step3-household-continuity

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: people-step3-household-continuity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.32.1'
          run_install: false
      - run: pnpm install
      - run: python .github/scripts/people-step3-finalize.py
      - run: npx prisma format
      - run: npx prisma validate
      - run: npx prisma generate
      - run: pnpm --filter @aureus-v1/api exec tsc --noEmit
      - name: Commit finalized Step 3
        run: |
          rm .github/workflows/people-step3-finalize.yml
          rm .github/scripts/people-step3-finalize.py
          rm -f docs/work-orders/.people-step3-finalizer-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/schema.prisma apps/api/src/households/household-continuity.service.ts .github/workflows/people-step3-finalize.yml .github/scripts/people-step3-finalize.py docs/work-orders/.people-step3-finalizer-trigger
          git commit -m 'fix: finalize Step 3 schema and lifecycle guards'
          git push origin HEAD:people-step3-household-continuity
