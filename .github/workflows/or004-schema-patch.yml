name: OR-004 Schema Patch Helper

on:
  push:
    branches:
      - feat/or-004-people-need-resolution
    paths:
      - .github/workflows/or004-schema-patch.yml

permissions:
  contents: write

jobs:
  patch-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/or-004-people-need-resolution
          fetch-depth: 0

      - name: Add PERSONAL_NEED_RESOLUTION to Prisma enum
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('prisma/schema.prisma')
          text = path.read_text()
          old = """enum ResponsibilityKind {
            OPPORTUNITY_DECISION
            OPPORTUNITY_APPLICATION_GUIDANCE
          }"""
          new = """enum ResponsibilityKind {
            OPPORTUNITY_DECISION
            OPPORTUNITY_APPLICATION_GUIDANCE
            PERSONAL_NEED_RESOLUTION
          }"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one ResponsibilityKind block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit exact schema change
        run: |
          git diff --check
          git diff -- prisma/schema.prisma
          if git diff --quiet -- prisma/schema.prisma; then
            echo "No schema change required"
            exit 0
          fi
          git config user.name "Aureus OR-004 Builder"
          git config user.email "actions@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "OR-004: add personal need responsibility kind to Prisma"
          git push origin HEAD:feat/or-004-people-need-resolution
