name: Step 1 Profile Test Fixture Repair

on:
  push:
    branches:
      - chatgpt/aureus-business-step1-final-repair

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/aureus-business-step1-final-repair
          fetch-depth: 0

      - name: Update typed profile fixtures and pronunciation UI coverage
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}; found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          greeting = Path("apps/web/design-system/components/home/Greeting.test.tsx")
          text = greeting.read_text()
          text = text.replace("displayName: 'Alice', bio: null", "displayName: 'Alice', namePronunciation: null, bio: null")
          text = text.replace("displayName: 'Alex', bio: null", "displayName: 'Alex', namePronunciation: null, bio: null")
          greeting.write_text(text)

          replace_once(
              "apps/web/design-system/components/profile/ProfilePage.test.tsx",
              "id: 'profile-1', userId: 'member-1', displayName: 'Alice', bio: 'A short bio'",
              "id: 'profile-1', userId: 'member-1', displayName: 'Alice', namePronunciation: null, bio: 'A short bio'",
          )
          page = Path("apps/web/design-system/components/profile/ProfilePage.test.tsx")
          text = page.read_text()
          text = text.replace("getByLabelText('Display name')", "getByLabelText('What should Aureus call you?')")
          text = text.replace(
              "await userEvent.type(screen.getByLabelText('What should Aureus call you?'), 'New Member');\n    await userEvent.click(screen.getByRole('button', { name: 'Save profile' }));\n\n    await waitFor(() =>\n      expect(mockedApi.createMyProfile).toHaveBeenCalledWith('token-123', 'member-1', { displayName: 'New Member' }),",
              "await userEvent.type(screen.getByLabelText('What should Aureus call you?'), 'New Member');\n    await userEvent.type(screen.getByLabelText('How do you pronounce your name?'), 'NEW MEM-ber');\n    await userEvent.click(screen.getByRole('button', { name: 'Save profile' }));\n\n    await waitFor(() =>\n      expect(mockedApi.createMyProfile).toHaveBeenCalledWith('token-123', 'member-1', {\n        displayName: 'New Member',\n        namePronunciation: 'NEW MEM-ber',\n      }),",
          )
          page.write_text(text)

          replace_once(
              "apps/web/state/profile/ProfileContext.test.tsx",
              "id: 'profile-1', userId: 'member-1', displayName: 'Alice', bio: null",
              "id: 'profile-1', userId: 'member-1', displayName: 'Alice', namePronunciation: null, bio: null",
          )

      - name: Commit fixture repair
        run: |
          git config user.name "Aureus Step 1 Builder"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/step1-profile-test-fixture-fix.yml
          git add apps/web/design-system/components/home/Greeting.test.tsx apps/web/design-system/components/profile/ProfilePage.test.tsx apps/web/state/profile/ProfileContext.test.tsx
          git commit -m "Step 1: update profile test fixtures for conversation identity"
          git push origin HEAD:chatgpt/aureus-business-step1-final-repair
