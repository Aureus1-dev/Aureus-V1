name: People Step 1 reconciliation

on:
  push:
    branches:
      - people/step1-need-to-resolution-v2

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[people-step1-reconciled]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch historical OR-004 evidence
        run: git fetch origin feat/or-004-people-need-resolution:refs/remotes/origin/feat/or-004-people-need-resolution

      - name: Reconcile runtime onto current candidate
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=origin/feat/or-004-people-need-resolution

          mkdir -p apps/api/src/people-resolutions
          for path in \
            apps/api/src/people-resolutions/people-resolutions.controller.ts \
            apps/api/src/people-resolutions/people-resolutions.dto.ts \
            apps/api/src/people-resolutions/people-resolutions.module.ts \
            apps/api/src/people-resolutions/people-resolutions.service.ts \
            apps/api/src/people-resolutions/people-resolutions.service.spec.ts \
            apps/api/src/responsibilities/repositories/prisma-responsibility.repository.ts \
            apps/api/src/responsibilities/repositories/responsibility.repository.interface.ts \
            apps/api/src/responsibilities/responsibilities.service.ts \
            apps/api/src/needs/dto/safe-failure-response.dto.ts \
            apps/api/src/needs/needs.module.ts \
            apps/api/src/needs/needs.service.ts
          do
            git show "$SOURCE:$path" > "$path"
          done

          python - <<'PY'
          from pathlib import Path

          app = Path('apps/api/src/app.module.ts')
          text = app.read_text()
          old = "import { PeopleHelpModule } from './people-help/people-help.module';\n"
          new = old + "import { PeopleResolutionsModule } from './people-resolutions/people-resolutions.module';\n"
          if 'PeopleResolutionsModule' not in text:
              if old not in text:
                  raise SystemExit('PeopleHelpModule import anchor missing')
              text = text.replace(old, new, 1)
              anchor = '    PeopleHelpModule,\n'
              if anchor not in text:
                  raise SystemExit('PeopleHelpModule module anchor missing')
              text = text.replace(anchor, anchor + '    PeopleResolutionsModule,\n', 1)
          app.write_text(text)

          schema = Path('prisma/schema.prisma')
          text = schema.read_text()
          if 'PERSONAL_NEED_RESOLUTION' not in text:
              anchor = '  OPPORTUNITY_APPLICATION_GUIDANCE\n  BUSINESS_PROMISE\n'
              if anchor not in text:
                  raise SystemExit('ResponsibilityKind enum anchor missing')
              text = text.replace(
                  anchor,
                  '  OPPORTUNITY_APPLICATION_GUIDANCE\n  PERSONAL_NEED_RESOLUTION\n  BUSINESS_PROMISE\n',
                  1,
              )
          schema.write_text(text)
          PY

          mkdir -p prisma/migrations/20260916020000_add_personal_need_resolution_kind
          cat > prisma/migrations/20260916020000_add_personal_need_resolution_kind/migration.sql <<'SQL'
          -- People Step 1 Responsibility kind vocabulary.
          -- Kept separate so PostgreSQL commits the enum value before the following
          -- migration references it in CHECK constraints and partial-index predicates.
          ALTER TYPE "ResponsibilityKind"
            ADD VALUE IF NOT EXISTS 'PERSONAL_NEED_RESOLUTION';
          SQL

          mkdir -p prisma/migrations/20260916020100_people_step1_need_resolution
          cat > prisma/migrations/20260916020100_people_step1_need_resolution/migration.sql <<'SQL'
          -- People Step 1: one open Personal Need Responsibility per member/conversation.
          -- Conversation is the existing canonical source scope for StatedNeed in V1;
          -- no duplicate Case/Ticket/source table is introduced.
          CREATE UNIQUE INDEX "Responsibility_one_open_personal_need_per_conversation"
          ON "Responsibility" ("principalUserId", "originConversationId", "kind")
          WHERE
            "contextType" = 'PERSONAL'
            AND "kind" = 'PERSONAL_NEED_RESOLUTION'
            AND "principalUserId" IS NOT NULL
            AND "originConversationId" IS NOT NULL
            AND "status" IN (
              'ACTIVE',
              'WAITING_ON_AUREUS',
              'WAITING_ON_USER',
              'WAITING_ON_THIRD_PARTY',
              'BLOCKED'
            );

          -- Fail closed if application code ever tries to manufacture a cross-context
          -- or widened-authority Personal Need Responsibility.
          ALTER TABLE "Responsibility"
          ADD CONSTRAINT "Responsibility_personal_need_resolution_shape"
          CHECK (
            "kind" <> 'PERSONAL_NEED_RESOLUTION'
            OR (
              "contextType" = 'PERSONAL'
              AND "principalUserId" IS NOT NULL
              AND "principalOrganizationId" IS NULL
              AND "originConversationId" IS NOT NULL
              AND "originOpportunityId" IS NULL
              AND "authorityClass" = 'GUIDANCE_ONLY'
              AND "privacyScope" = 'PERSONAL_PRIVATE'
            )
          );
          SQL

          # This helper exists only to perform the governed reconciliation. Remove it
          # from the candidate so the product PR contains no permanent build-only workflow.
          rm -f .github/workflows/people-step1-port.yml

      - name: Sanity-check recovered Step 1 shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PERSONAL_NEED_RESOLUTION' prisma/schema.prisma
          grep -q 'PeopleResolutionsModule' apps/api/src/app.module.ts
          grep -q 'isHumanStewardReachable' apps/api/src/needs/needs.service.ts
          grep -q 'acceptPersonalNeedResolution' apps/api/src/responsibilities/responsibilities.service.ts
          grep -q 'did not create a phantom handoff' apps/api/src/people-resolutions/people-resolutions.service.ts

      - name: Commit reconciled implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Aureus Step Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No reconciliation changes remain.'
            exit 0
          fi
          git commit -m 'feat: complete People Step 1 universal need resolution [people-step1-reconciled]'
          git push origin HEAD:people/step1-need-to-resolution-v2
