name: Steward Release Gate

on:
  workflow_dispatch:
    inputs:
      web_origin:
        description: Exact deployed web origin
        required: true
        default: https://aureus-v1.onrender.com
      api_origin:
        description: Exact deployed API origin
        required: true
        default: https://aureus-k2c3.onrender.com
      require_voice:
        description: Require a real voice-provider brokerage check
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deployed-system-gate:
    name: Exact Deployment Canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deployed release gate
        shell: bash
        env:
          RELEASE_WEB_ORIGIN: ${{ inputs.web_origin }}
          RELEASE_API_ORIGIN: ${{ inputs.api_origin }}
          RELEASE_REQUIRE_VOICE: ${{ inputs.require_voice }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          node scripts/release-gate.mjs | tee steward-release-evidence.json
      - name: Run real-browser first-session gate
        if: always() && inputs.require_voice
        shell: bash
        env:
          RELEASE_WEB_ORIGIN: ${{ inputs.web_origin }}
          RELEASE_TEST_EMAIL: ${{ secrets.RELEASE_TEST_EMAIL }}
          RELEASE_TEST_PASSWORD: ${{ secrets.RELEASE_TEST_PASSWORD }}
        run: |
          set -o pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo '{"result":"HOLD","failure":"No Chrome/Chromium binary is available on the release runner."}' | tee browser-first-session-evidence.json
            exit 1
          fi
          RELEASE_CHROME_BIN="$CHROME_BIN" node scripts/browser-first-session-canary.mjs 2>&1 | tee browser-first-session-evidence.json
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steward-release-evidence-${{ github.sha }}
          path: |
            steward-release-evidence.json
            browser-first-session-evidence.json
          if-no-files-found: warn