name: Steward Release Gate

on:
  workflow_dispatch:
    inputs:
      web_origin:
        description: Exact deployed web origin
        required: true
        default: https://aureus-v1.onrender.com
      api_origin:
        description: Exact deployed API origin
        required: true
        default: https://aureus-k2c3.onrender.com
      require_voice:
        description: Require a real voice-provider brokerage check
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: steward-release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deployed-system-gate:
    name: Living Exact-Deployment Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate living release registry
        run: node scripts/release-gate-manifest.mjs
      - name: Resolve browser runtime
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "chrome_bin=$CHROME_BIN" >> "$GITHUB_OUTPUT"
      - name: Run every required release contract
        shell: bash
        env:
          RELEASE_WEB_ORIGIN: ${{ inputs.web_origin }}
          RELEASE_API_ORIGIN: ${{ inputs.api_origin }}
          RELEASE_REQUIRE_VOICE: ${{ inputs.require_voice }}
          RELEASE_EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_EVIDENCE_DIR: release-evidence
          RELEASE_CHROME_BIN: ${{ steps.browser.outputs.chrome_bin }}
          RELEASE_TEST_EMAIL: ${{ secrets.RELEASE_TEST_EMAIL }}
          RELEASE_TEST_PASSWORD: ${{ secrets.RELEASE_TEST_PASSWORD }}
        run: |
          set -o pipefail
          node scripts/run-release-gates.mjs
      - name: Verify required release evidence exists
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s release-evidence/release-gate-summary.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('release-evidence/release-gate-summary.json','utf8')); if(!['AUTOMATED_GATE_PASSED','HOLD'].includes(p.result)) process.exit(1)"
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steward-release-evidence-${{ github.sha }}
          path: release-evidence/*.json
          if-no-files-found: error
