name: People Step 1 test hardening

on:
  push:
    branches:
      - people/step1-need-to-resolution-v2

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[people-step1-tests-hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Step 1 database and HTTP deny-path proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Extend the real-Postgres Responsibility integration suite.
          p = Path('apps/api/src/responsibilities/responsibilities.integration.spec.ts')
          s = p.read_text()
          if 'deduplicates concurrent Personal Need acceptance at the database boundary' not in s:
              anchor = "  it('cascades personal Responsibility/event state when the owning User is deleted', async () => {\n"
              addition = '''  it('deduplicates concurrent Personal Need acceptance at the database boundary', async () => {\n    const conversationId = randomUUID();\n    const attempts = await Promise.all(\n      Array.from({ length: 8 }, (_, index) =>\n        repo.createAccepted({\n          principalUserId: userId,\n          kind: ResponsibilityKind.PERSONAL_NEED_RESOLUTION,\n          successCriteria: {\n            type: 'PERSONAL_NEED_RESOLUTION',\n            statedNeedId: randomUUID(),\n          },\n          objective: `Carry one personal need, attempt ${index}`,\n          originConversationId: conversationId,\n          originOpportunityId: null,\n        }),\n      ),\n    );\n\n    expect(new Set(attempts.map((row) => row.id))).toHaveLength(1);\n    expect(\n      await prisma.db.responsibility.count({\n        where: {\n          principalUserId: userId,\n          originConversationId: conversationId,\n          kind: ResponsibilityKind.PERSONAL_NEED_RESOLUTION,\n          status: {\n            in: [\n              ResponsibilityStatus.ACTIVE,\n              ResponsibilityStatus.WAITING_ON_AUREUS,\n              ResponsibilityStatus.WAITING_ON_USER,\n              ResponsibilityStatus.WAITING_ON_THIRD_PARTY,\n              ResponsibilityStatus.BLOCKED,\n            ],\n          },\n        },\n      }),\n    ).toBe(1);\n  });\n\n  it('rejects cross-context or non-private Personal Need rows at the database boundary', async () => {\n    await expect(\n      prisma.db.responsibility.create({\n        data: {\n          kind: ResponsibilityKind.PERSONAL_NEED_RESOLUTION,\n          objective: 'Personal Need may not become Business work',\n          status: ResponsibilityStatus.ACTIVE,\n          contextType: ResponsibilityContextType.BUSINESS_TENANT,\n          principalUserId: null,\n          principalOrganizationId: organizationId,\n          originConversationId: randomUUID(),\n          originOpportunityId: null,\n          successCriteria: { type: 'PERSONAL_NEED_RESOLUTION', statedNeedId: randomUUID() },\n          authorityClass: ResponsibilityAuthorityClass.GUIDANCE_ONLY,\n          authorityPolicyVersion: 'responsibility-guidance-v1',\n          privacyScope: ResponsibilityPrivacyScope.BUSINESS_PRIVATE,\n          privacyPolicyVersion: 'business-private-v1',\n        },\n      }),\n    ).rejects.toThrow();\n\n    await expect(\n      prisma.db.responsibility.create({\n        data: {\n          kind: ResponsibilityKind.PERSONAL_NEED_RESOLUTION,\n          objective: 'Personal Need must remain private',\n          status: ResponsibilityStatus.ACTIVE,\n          contextType: ResponsibilityContextType.PERSONAL,\n          principalUserId: userId,\n          principalOrganizationId: null,\n          originConversationId: randomUUID(),\n          originOpportunityId: null,\n          successCriteria: { type: 'PERSONAL_NEED_RESOLUTION', statedNeedId: randomUUID() },\n          authorityClass: ResponsibilityAuthorityClass.GUIDANCE_ONLY,\n          authorityPolicyVersion: 'responsibility-guidance-v1',\n          privacyScope: ResponsibilityPrivacyScope.SHARED_TRANSACTION,\n          privacyPolicyVersion: 'shared-transaction-v1',\n        },\n      }),\n    ).rejects.toThrow();\n  });\n\n'''
              if anchor not in s:
                  raise SystemExit('Responsibility integration insertion anchor missing')
              s = s.replace(anchor, addition + anchor, 1)
          p.write_text(s)

          # Update work-order truth after constructor red-team.
          p = Path('docs/work-orders/AUREUS-PEOPLE-STEP1-NEED-TO-RESOLUTION.md')
          s = p.read_text()
          s = s.replace(
              '- treat a resolved human escalation as `REPORTED` unless an independent verification source actually proves the underlying life outcome;\n',
              '- never treat a resolved human escalation as proof that the underlying life outcome occurred; a resolved escalation proves only that the human handoff itself reached its terminal state;\n- require separate source-domain outcome evidence for the underlying need; an explicit member outcome report is `REPORTED` unless independently verified elsewhere;\n',
              1,
          )
          s = s.replace(
              '11. resolved human escalation remains `REPORTED` unless independent verification exists;\n',
              '11. resolved human escalation never completes the underlying need by itself; explicit member outcome evidence remains `REPORTED` unless independent verification exists;\n',
              1,
          )
          p.write_text(s)
          PY

          cat > apps/api/src/people-resolutions/people-resolutions.e2e.spec.ts <<'TS'
          import { randomUUID } from 'crypto';
          import { INestApplication, ValidationPipe } from '@nestjs/common';
          import { JwtService } from '@nestjs/jwt';
          import { Test, TestingModule } from '@nestjs/testing';
          import {
            NeedOutcomeStatus,
            ResponsibilityContextType,
            ResponsibilityEvidenceLevel,
            ResponsibilityKind,
            ResponsibilityPrivacyScope,
            ResponsibilityStatus,
            UserRole,
          } from '@prisma/client';
          import request from 'supertest';
          import { AppModule } from '../app.module';
          import { AllExceptionsFilter } from '../common/filters/all-exceptions.filter';
          import { PrismaService } from '../prisma/prisma.service';

          describe('People Step 1 — Universal Need to Resolution E2E', () => {
            let app: INestApplication;
            let jwt: JwtService;
            let prisma: PrismaService;
            let ownerId: string;
            let otherId: string;
            let ownerToken: string;
            let otherToken: string;
            let conversationId: string;
            let otherConversationId: string;
            let statedNeedId: string;
            let otherNeedId: string;
            let responsibilityId: string;

            const marker = 'people-step1-' + randomUUID();
            const tokenFor = (id: string, email: string): string =>
              jwt.sign({ sub: id, email, roles: [UserRole.MEMBER] });

            beforeAll(async () => {
              const moduleRef: TestingModule = await Test.createTestingModule({
                imports: [AppModule],
              }).compile();
              app = moduleRef.createNestApplication();
              app.useGlobalPipes(
                new ValidationPipe({
                  whitelist: true,
                  forbidNonWhitelisted: true,
                  transform: true,
                }),
              );
              app.useGlobalFilters(new AllExceptionsFilter());
              await app.init();

              jwt = app.get(JwtService);
              prisma = app.get(PrismaService);

              const ownerEmail = `owner-${marker}@example.test`;
              const otherEmail = `other-${marker}@example.test`;
              const owner = await prisma.db.user.create({ data: { email: ownerEmail } });
              const other = await prisma.db.user.create({ data: { email: otherEmail } });
              ownerId = owner.id;
              otherId = other.id;
              ownerToken = tokenFor(ownerId, ownerEmail);
              otherToken = tokenFor(otherId, otherEmail);

              const ownerConversation = await request(app.getHttpServer())
                .post('/ai/conversations')
                .set('Authorization', `Bearer ${ownerToken}`)
                .send({ title: 'People Step 1 owner conversation' })
                .expect(201);
              conversationId = ownerConversation.body.id;

              const otherConversation = await request(app.getHttpServer())
                .post('/ai/conversations')
                .set('Authorization', `Bearer ${otherToken}`)
                .send({ title: 'People Step 1 other conversation' })
                .expect(201);
              otherConversationId = otherConversation.body.id;

              const ownedNeed = await prisma.db.statedNeed.create({
                data: {
                  userId: ownerId,
                  conversationId,
                  content: 'I need help understanding a unique personal situation.',
                },
              });
              statedNeedId = ownedNeed.id;

              const foreignNeed = await prisma.db.statedNeed.create({
                data: {
                  userId: otherId,
                  conversationId: otherConversationId,
                  content: 'I need help understanding another unique situation.',
                },
              });
              otherNeedId = foreignNeed.id;
            });

            afterAll(async () => {
              await prisma.db.needOutcomeReport.deleteMany({
                where: { userId: { in: [ownerId, otherId] } },
              });
              await prisma.db.responsibility.deleteMany({
                where: { principalUserId: { in: [ownerId, otherId] } },
              });
              await prisma.db.statedNeed.deleteMany({
                where: { userId: { in: [ownerId, otherId] } },
              });
              await prisma.db.user.deleteMany({ where: { id: { in: [ownerId, otherId] } } });
              await app.close();
            });

            it('rejects unauthenticated resolution acceptance', async () => {
              await request(app.getHttpServer())
                .post('/people/resolutions')
                .send({ statedNeedId, objective: 'Carry this need with me' })
                .expect(401);
            });

            it('does not allow another member stated need to become provenance', async () => {
              await request(app.getHttpServer())
                .post('/people/resolutions')
                .set('Authorization', `Bearer ${ownerToken}`)
                .send({ statedNeedId: otherNeedId, objective: 'Carry a foreign need' })
                .expect(404);
            });

            it('rejects caller-supplied context or authority instead of trusting it', async () => {
              await request(app.getHttpServer())
                .post('/people/resolutions')
                .set('Authorization', `Bearer ${ownerToken}`)
                .send({
                  statedNeedId,
                  objective: 'Carry this need with me',
                  contextType: 'BUSINESS_TENANT',
                })
                .expect(400);
            });

            it('accepts one private guidance-only Personal Need Responsibility without granting authority', async () => {
              const beforeGrants = await prisma.db.authorityGrant.count({
                where: { subjectUserId: ownerId },
              });

              const response = await request(app.getHttpServer())
                .post('/people/resolutions')
                .set('Authorization', `Bearer ${ownerToken}`)
                .send({ statedNeedId, objective: 'Help me get this situation resolved' })
                .expect(201);

              responsibilityId = response.body.responsibility.id;
              expect(response.body.responsibility.kind).toBe(ResponsibilityKind.PERSONAL_NEED_RESOLUTION);
              expect(response.body.responsibility.contextType).toBe(ResponsibilityContextType.PERSONAL);
              expect(response.body.responsibility.privacyScope).toBe(ResponsibilityPrivacyScope.PERSONAL_PRIVATE);
              expect(response.body.responsibility.authorityClass).toBe('GUIDANCE_ONLY');
              expect(response.body.memberActionRequired).toBe(true);
              expect(
                await prisma.db.authorityGrant.count({ where: { subjectUserId: ownerId } }),
              ).toBe(beforeGrants);
            });

            it('returns the same open Responsibility on retry and hides it from another member', async () => {
              const retry = await request(app.getHttpServer())
                .post('/people/resolutions')
                .set('Authorization', `Bearer ${ownerToken}`)
                .send({ statedNeedId, objective: 'A retry must not duplicate the promise' })
                .expect(201);
              expect(retry.body.responsibility.id).toBe(responsibilityId);

              await request(app.getHttpServer())
                .get(`/people/resolutions/${responsibilityId}`)
                .set('Authorization', `Bearer ${otherToken}`)
                .expect(404);
            });

            it('keeps the need open when the member reports it is still unresolved', async () => {
              const response = await request(app.getHttpServer())
                .post(`/people/resolutions/${responsibilityId}/outcome`)
                .set('Authorization', `Bearer ${ownerToken}`)
                .send({ resolved: false, note: 'This still needs work.' })
                .expect(201);

              expect(response.body.responsibility.status).not.toBe(ResponsibilityStatus.COMPLETED);
              const report = await prisma.db.needOutcomeReport.findFirst({
                where: { statedNeedId, status: NeedOutcomeStatus.STILL_UNRESOLVED },
                orderBy: { createdAt: 'desc' },
              });
              expect(report).not.toBeNull();
            });

            it('completes only from explicit underlying-need outcome evidence and preserves REPORTED truth', async () => {
              const response = await request(app.getHttpServer())
                .post(`/people/resolutions/${responsibilityId}/outcome`)
                .set('Authorization', `Bearer ${ownerToken}`)
                .send({ resolved: true, note: 'The underlying situation is resolved now.' })
                .expect(201);

              expect(response.body.responsibility.status).toBe(ResponsibilityStatus.COMPLETED);
              expect(response.body.evidenceMeaning).toContain('not representing that report as independent');

              const completed = await prisma.db.responsibility.findUniqueOrThrow({
                where: { id: responsibilityId },
                include: { events: true },
              });
              const completion = completed.events.find((event) => event.type === 'COMPLETED');
              expect(completion?.sourceRecordType).toBe('NeedOutcomeReport');
              expect(completion?.sourceState).toBe(NeedOutcomeStatus.RESOLVED);
              expect(completion?.evidenceLevel).toBe(ResponsibilityEvidenceLevel.REPORTED);
            });

            it('does not reopen terminal work on retry', async () => {
              const retry = await request(app.getHttpServer())
                .post('/people/resolutions')
                .set('Authorization', `Bearer ${ownerToken}`)
                .send({ statedNeedId, objective: 'Try again after completion' })
                .expect(201);

              expect(retry.body.responsibility.id).not.toBe(responsibilityId);
              expect(retry.body.responsibility.status).not.toBe(ResponsibilityStatus.COMPLETED);
            });
          });
          TS

          rm -f .github/workflows/people-step1-test-hardening.yml

      - name: Sanity checks
        run: |
          set -euo pipefail
          grep -q 'deduplicates concurrent Personal Need acceptance' apps/api/src/responsibilities/responsibilities.integration.spec.ts
          grep -q 'Universal Need to Resolution E2E' apps/api/src/people-resolutions/people-resolutions.e2e.spec.ts
          grep -q 'resolved human escalation never completes' docs/work-orders/AUREUS-PEOPLE-STEP1-NEED-TO-RESOLUTION.md

      - name: Commit test hardening
        run: |
          set -euo pipefail
          git config user.name 'Aureus Step Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'test: prove People Step 1 trust and race boundaries [people-step1-tests-hardened]'
          git push origin HEAD:people/step1-need-to-resolution-v2
