name: Step 2 Authority Builder

on:
  push:
    branches:
      - chatgpt/aureus-business-step2-authority-consent-trust

permissions:
  contents: write

jobs:
  build-step2:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aureus
          POSTGRES_PASSWORD: aureus
          POSTGRES_DB: aureus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aureus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aureus:aureus@localhost:5432/aureus?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-do-not-use-in-production-min-32-chars
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/aureus-business-step2-authority-consent-trust
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.32.1'
          run_install: false
      - run: pnpm install
      - name: Generate implementation
        run: python3 scripts/step2-authority-build.py
      - name: Format and generate Prisma client
        run: |
          npx prisma format
          npx prisma generate
      - name: Typecheck
        run: pnpm run check-types
      - name: Targeted authority API test
        run: |
          npx prisma migrate deploy
          pnpm --filter @aureus-v1/api run test -- authority.e2e.spec.ts --runInBand
      - name: Targeted Trust Center web test
        run: pnpm --filter @aureus-v1/web run test -- TrustCenterTab.test.tsx --runInBand
      - name: Commit generated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f scripts/step2-authority-build.py .github/workflows/step2-authority-builder.yml
          git add -A
          git commit -m "Step 2: implement Authority, Consent & Trust"
          git push origin HEAD:chatgpt/aureus-business-step2-authority-consent-trust
