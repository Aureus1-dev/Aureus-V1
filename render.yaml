# Render Blueprint for Aureus — both apps/api (NestJS) and apps/web (Next.js).
#
# This file exists to close a real gap found during the 2026-07-28
# "every route 404s" incident investigation: this repository had NO
# committed Render configuration. Root Directory, Build Command, Start
# Command, and health-check path lived only in the Render dashboard —
# invisible to anyone reading this repo, with no audit trail and no way
# to redeploy an identical service elsewhere. That is a real risk on its
# own even though it was not the direct cause of the reported 404s (see
# the incident note in docs/operations/production-runbook.md).
#
# Both Dockerfiles' own header comments are explicit: each must be built
# from the REPOSITORY ROOT, not from apps/api or apps/web, because both
# need the pnpm workspace (apps/*, packages/*) and the root-level Prisma
# schema (prisma/schema.prisma, prisma.config.ts) to resolve. `rootDir`
# is deliberately NOT set on either service below for exactly this
# reason — setting Render's Root Directory to a subdirectory would break
# both Dockerfiles' COPY paths, which are all relative to the repo root.
#
# CORS_ORIGIN (API), FRONTEND_URL (API), and NEXT_PUBLIC_API_BASE_URL
# (web) are deliberately left `sync: false` rather than auto-wired
# between the two services: Render's inter-service env var references
# (`fromService`) only expose a bare host, not a full https:// origin,
# and the two services' URLs (or eventual custom domains) aren't known
# until first deploy — a chicken-and-egg auto-wiring attempt here would
# be more fragile than an explicit, documented manual step. Fill these
# in from the Render dashboard once both services have real URLs (see
# the comments on each var below for the exact value each one needs).

services:
  - type: web
    name: aureus-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    # /health/ready (DB-inclusive), not /health/live — a platform deciding
    # whether a new deploy is ready for traffic should confirm the database
    # is reachable, not just that the process started. The Dockerfile's own
    # HEALTHCHECK
    # (a container-level liveness check) still uses /health/live separately.
    healthCheckPath: /health/ready
    # Pilot deploys are intentionally manual: CI passing proves the image,
    # but cannot prove the human-verification, Tending Run, Memory Rights,
    # or Founder walkthrough gates in docs/launch/WORKORDERS.md. Change to
    # `checksPass` only after Pilot-25 authorizes continuous delivery.
    autoDeployTrigger: off
    # Runs before the new version receives traffic (Render's own
    # pre-deploy hook, distinct from the container's CMD). Plain
    # `prisma migrate deploy`, not scripts/db-migrate-deploy.sh's
    # backup-wrapped version — that wrapper shells out to pg_dump/
    # pg_restore, which apps/api/Dockerfile's runtime layer does not
    # install (only openssl/libc6-compat, see the Dockerfile). Render's
    # own managed Postgres has its own backup story; rely on that, or
    # run the wrapper script manually from a deploy host per
    # docs/operations/production-runbook.md §4 before a migration you
    # want an extra manual safety net around.
    # Founder Pilot also synchronizes the reviewed launch Opportunity catalog.
    # The catalog seed is idempotent and its exact-title records are explicitly
    # seed-managed: every value carries its researched-at timestamp, closed
    # seasonal entries are retired, and public City Sheet candidates remain
    # UNVERIFIED. This makes a deployed reviewed SHA carry the same opportunity
    # truth CI reviewed instead of requiring an undocumented manual seed step.
    preDeployCommand: npx prisma migrate deploy && npx prisma db seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: aureus-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Set to the deployed web service's real origin, e.g.
      # https://aureus-web.onrender.com (or the production custom domain).
      # Required in production — main.ts's env validation rejects
      # NODE_ENV=production with CORS_ORIGIN left at its "*" default.
      - key: CORS_ORIGIN
        sync: false
      # Same origin as CORS_ORIGIN above — where verification/reset
      # emails link back to.
      - key: FRONTEND_URL
        sync: false
      # Production refuses the placeholder AI provider. V1 uses OpenAI by
      # default; change both fields together if Anthropic is chosen instead.
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      # A real SMTP transport is required for account verification and
      # password recovery. Adjust port/secure together for port 465.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      # Make launch cost stop-lines explicit in the hosting dashboard.
      - key: AI_EMERGENCY_STOP
        value: false
      - key: AI_GLOBAL_DAILY_BUDGET_USD
        value: 50
      - key: AI_USER_DAILY_BUDGET_USD
        value: 2
      - key: GUEST_SESSION_RETENTION_DAYS
        value: 7
      - key: SENTRY_DSN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENABLE_API_DOCS
        value: false

  - type: web
    name: aureus-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    # Matches the Dockerfile's own HEALTHCHECK (GET /, expects < 500).
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # NEXT_PUBLIC_* vars are inlined into the client bundle at BUILD
      # time, not read at runtime (see apps/web/Dockerfile's own comment
      # and lib/api/config.ts). Render passes envVars through as Docker
      # build args automatically for a `runtime: docker` service, which
      # is why this works here without a separate `dockerBuildArgs`
      # block — apps/web/Dockerfile already declares
      # `ARG NEXT_PUBLIC_API_BASE_URL`. Set this to the deployed
      # aureus-api service's real origin, e.g. https://aureus-api.onrender.com
      # (or its production custom domain), and trigger a rebuild (not
      # just a restart) after changing it, since it only takes effect
      # at build time.
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

databases:
  - name: aureus-postgres
    # `starter` is a legacy database type and cannot create a new instance.
    plan: basic-256mb
    region: oregon
